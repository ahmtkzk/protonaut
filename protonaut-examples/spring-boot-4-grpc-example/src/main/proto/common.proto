syntax = "proto3";

package io.protonaut.example.common;

option java_multiple_files = true;
option java_package = "io.protonaut.example.common";
option java_outer_classname = "CommonProto";

// Pagination parameters for list queries
message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
  string sort_by = 3;
  bool sort_descending = 4;
}

// Pagination metadata included in list responses
message PageResponse {
  int32 page = 1;
  int32 page_size = 2;
  int64 total_elements = 3;
  int32 total_pages = 4;
}

// Audit trail metadata for mutations
message AuditMetadata {
  string created_by = 1;
  int64 created_at = 2;
  string updated_by = 3;
  int64 updated_at = 4;
}

// Standard operational status response
message StatusResponse {
  bool success = 1;
  string message = 2;
  int32 code = 3;
}
